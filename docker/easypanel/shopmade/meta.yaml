name: Shopmade
description:
  Shopmade is an open-source website and customer system for a small business,
  built on Laravel. It serves the public website, an admin for the owner and
  staff, and a client portal for the business's customers. Pages, facts and the
  theme are files with their own git history, so every save can be restored.
  An MCP server with OAuth lets Claude or another AI assistant read and edit the
  site, and features such as jobs, invoicing or a shop are added as Laravel
  packages.
instructions:
  After the first deploy, open the app service's Console in Easypanel and run
  `php artisan user:create-owner you@example.com "Your Name"`. It prints a
  one-time password. Sign in at https://your-domain/login, and connect Claude
  by adding https://your-domain/mcp/agents as a custom connector.
changeLog:
  - date: 2026-10-28
    description: First release
links:
  - label: Website
    url: https://shopmade.pro
  - label: Documentation
    url: https://github.com/LabskAI/shopmade-core#readme
  - label: Github
    url: https://github.com/LabskAI/shopmade-core
contributors:
  - name: Labs Kai
    url: https://labskai.com
schema:
  type: object
  required:
    - appServiceName
    - appServiceImage
    - databaseServiceName
    - orgName
  properties:
    appServiceName:
      type: string
      title: App Service Name
      default: shopmade
    appServiceImage:
      type: string
      title: App Service Image
      default: ghcr.io/labskai/shopmade-core:0.1.0
    databaseServiceName:
      type: string
      title: Database Service Name
      default: shopmade-db
    orgName:
      type: string
      title: Business Name
      default: Shopmade
benefits:
  - title: A Website You Can Edit From Claude
    description:
      Every site has its own MCP server with OAuth, so Claude can read and edit
      pages, facts and the theme after you sign in once.
  - title: Content With History
    description:
      Pages and settings are plain files with a git history of every save, kept
      on a volume and restorable from the admin.
  - title: Grow It With Packages
    description:
      Jobs, invoicing, a shop and a CRM are open-source Laravel packages that
      plug into the admin, the client portal and the MCP server.
features:
  - title: Public Website
    description:
      Markdown pages, business facts, theme tokens, sitemap, llms.txt and
      structured data, served from the same app.
  - title: Admin And Roles
    description:
      Owner, admin and staff sign-in with role-based tools, customers and a
      website editor with page history.
  - title: Client Portal
    description:
      The business's customers get their own sign-in to see their records and
      send change requests.
  - title: MCP Server
    description:
      An MCP endpoint at /mcp/agents with OAuth 2.1 and connectors you can list
      and revoke.
tags:
  - CMS
  - Website Builder
  - CRM
  - Business Apps
