server {
    listen 8080 default_server;
    server_name _;

    root /var/www/shopmade/public;
    index index.php;

    client_max_body_size 32m;

    # Compress text responses: Lighthouse counts every uncompressed byte, and the proxy in front may not compress.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/plain text/markdown text/xml application/javascript application/json application/xml application/manifest+json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
    }
}
