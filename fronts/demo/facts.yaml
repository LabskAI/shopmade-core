# Business facts for the demo company (fictional). Every page, the navigation and footer,
# the discovery files and the agents read these. If a fact appears on more than one page,
# it belongs here. Run `php artisan front:lint demo` after editing.

name: Demo Home Services
legal_name: Demo Home Services LLC
phone: "+1 555-010-0142"
email: hello@example.com

cities:
  - Riverton
  - Oak Hollow
  - Pine Ridge

services:
  - slug: house-cleaning
    name:
      en: House cleaning
      es: Limpieza de casas
  - slug: office-cleaning
    name:
      en: Office cleaning
      es: Limpieza de oficinas
  - slug: move-out-cleaning
    name:
      en: Move-out cleaning
      es: Limpieza de mudanzas

# The first language is the default (served without a /<lang> prefix).
languages:
  - en
  - es

# schema.org openingHours format: day codes Mo Tu We Th Fr Sa Su, 24-hour times.
hours:
  - "Mo-Fr 08:00-18:00"
  - "Sa 09:00-13:00"

# Claims the front must never make. Matched case-insensitively as whole words in pages,
# frontmatter and UI strings. Quote anything that starts with # or contains a colon.
never_write:
  - certified
  - OSHA
  - 5-star
  - best in
  - guaranteed
  - "#1"
  - award-winning
  - licensed and insured
  - certificado
  - certificada
  - garantizado
  - garantizada
  - 5 estrellas
  - con licencia y seguro

social: []

# Header button. A target "#form-<slug>" opens that form: on this page when it shows it, else on the page that does.
cta:
  label:
    en: Book a visit
    es: Reservar una visita
  target: "#form-contact"

# AIFormFlow forms. status: live embeds the form (form.js loads only on pages that show one); otherwise a hosted
# link is shown when there is one. Pages place a form with frontmatter forms: [contact] (after the page) or an
# inline :::form slug="contact" fence.
forms:
  - slug: contact
    name:
      en: Book a visit
      es: Reservar una visita
    lead:
      en: Tell us the address and what needs cleaning. We answer the same day.
      es: Díganos la dirección y qué hay que limpiar. Respondemos el mismo día.
    status: live
    client: shopmade-demo
    form:
      en: contact-en
      es: contact-es

# Company scripts: files under assets/ (or AIFormFlow URLs) only.
scripts:
  - src: assets/motion.js

logo:
  src: assets/logo.svg
  alt: Demo Home Services

# robots.txt and its Content-Signal line follow this policy.
discovery:
  ai_search: true
  ai_training: false

# The street address is published only when publish is true.
address:
  publish: false
  locality: Riverton
  country: US
