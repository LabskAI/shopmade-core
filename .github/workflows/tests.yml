name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pest:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: ['8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, intl, zip, bcmath
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: cp .env.example .env && php artisan key:generate

      - run: vendor/bin/pint --test

      - run: php artisan test --compact

  # Production installs skip require-dev: boot the app that way and hit the public site, so a runtime class that only
  # arrives through a dev dependency fails here.
  no-dev-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, intl, zip, bcmath
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress --no-dev --optimize-autoloader

      - run: npm ci && npm run build

      - name: Boot and hit the public site
        run: |
          cp .env.example .env
          sed -i 's/^DB_CONNECTION=.*/DB_CONNECTION=sqlite/; s#^DB_DATABASE=.*#DB_DATABASE='"$PWD"'/database/smoke.sqlite#' .env
          touch database/smoke.sqlite
          php artisan key:generate
          php artisan migrate --force
          php artisan front:lint demo
          php artisan serve --port=8000 > /tmp/serve.log 2>&1 &
          sleep 3
          for path in /up /login /site /site/sitemap.xml /site/llms.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000$path")
            echo "$path $code"
            test "$code" = 200 || { cat storage/logs/laravel.log; exit 1; }
          done

  pest-postgres:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: shopmade_testing
          POSTGRES_USER: shopmade
          POSTGRES_PASSWORD: shopmade
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shopmade -d shopmade_testing"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: shopmade
      DB_PASSWORD: shopmade

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, intl, zip, bcmath
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: cp .env.example .env && php artisan key:generate

      - run: php artisan test --compact -c phpunit.pgsql.xml

  assets:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: docker build --target production -t shopmade-core:ci .
