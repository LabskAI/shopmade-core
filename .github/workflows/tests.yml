name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite, intl, zip, bcmath
          coverage: none

      - run: composer install --no-interaction --prefer-dist --no-progress

      - run: cp .env.example .env && php artisan key:generate

      - run: vendor/bin/pint --test

      - run: php artisan test --compact

  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - run: docker build --target production -t shopmade-core:ci .

      # The same image with packages baked in, the way install.sh builds it (reuses the layers above).
      - run: docker build --target production --build-arg SHOPMADE_PACKAGES=jobs,crm -t shopmade-core:ci-packages .

      - run: docker run --rm --entrypoint php shopmade-core:ci-packages artisan about --only=environment
      - run: docker run --rm --entrypoint sh shopmade-core:ci-packages -c 'test -d vendor/labskai/shopmade-jobs && test -d vendor/labskai/shopmade-crm && ! test -d vendor/pestphp'

      # The queue worker and scheduler run as www-data through setpriv (docker/serve.sh); they must see the container env.
      - run: docker run --rm -e APP_KEY=ci-key -e DB_PASSWORD=ci-pass --entrypoint setpriv shopmade-core:ci --reuid=www-data --regid=www-data --init-groups -- sh -c 'test "$(id -un)" = www-data && test "$APP_KEY" = ci-key && test "$DB_PASSWORD" = ci-pass'

      # The Coolify template (docker/coolify/shopmade.yaml) with this build's image: Coolify fills the SERVICE_* values,
      # here they come from the environment. Then an MCP client signs in over OAuth and reads the starter site.
      - name: Coolify template boots and serves MCP
        env:
          SERVICE_URL_SHOPMADE: http://127.0.0.1:8080
          SERVICE_USER_POSTGRES: shopmade
          SERVICE_PASSWORD_POSTGRES: ci-postgres-password
          SESSION_SECURE_COOKIE: 'false'
        run: |
          export SERVICE_REALBASE64_32_APPKEY="$(openssl rand -base64 32)"
          cat > /tmp/coolify-ci.yaml <<'EOF'
          services:
            shopmade:
              image: shopmade-core:ci
              ports: ["127.0.0.1:8080:8080"]
          volumes:
            shopmade-storage:
            shopmade-content:
            shopmade-postgres:
          EOF
          compose="docker compose -p coolify-ci -f docker/coolify/shopmade.yaml -f /tmp/coolify-ci.yaml"
          $compose up -d --wait --wait-timeout 300 || { $compose logs; exit 1; }
          password="$($compose exec -T shopmade php artisan user:create-owner owner@example.com Owner | sed -n 's/.*Password: //p')"
          python3 .github/scripts/mcp-smoke.py http://127.0.0.1:8080 owner@example.com "$password" || { $compose logs shopmade; exit 1; }
